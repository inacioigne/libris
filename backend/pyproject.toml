[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "libris-title-v1"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "rdflib>=7,<8", "pyshacl>=0.29,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["libris_title*"]
