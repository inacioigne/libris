[project]
name = "libris-api"
version = "0.1.0"
description = "Libris modular library management API"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi[standard]>=0.143,<0.144",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.44,<2.1",
    "asyncpg>=0.31,<1",
    "alembic>=1.17,<2",
    "rdflib>=7.1,<8",
    "pyshacl>=0.30,<1",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libris"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<1", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.fastapi]
entrypoint = "libris.main:app"

[tool.pytest.ini_options]
testpaths = ["../../tests/api"]
markers = ["integration: exige PostgreSQL real dedicado e migrado"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
