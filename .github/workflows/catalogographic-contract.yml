name: Catalogographic contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.21'
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv python install 3.13
      - run: uv sync --locked --python 3.13
      - run: uv run python ../../scripts/generate_catalogographic_contract.py --check
      - run: uv run python ../../scripts/generate_catalogographic_openapi.py --check
      - run: uv run pytest ../../tests/api -q
      - run: uv run ruff check . ../../tests ../../scripts/generate_catalogographic_openapi.py
      - run: uv run mypy src
